server:
  port: 8081
  servlet:
    context-path: /api/v1/students

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/userdb
    username: ${LMS_DB_USER}
    password: ${LMS_DB_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

springdoc:
  packages-to-scan: com.lms.student_service.controller
  paths-to-match: /**
